name: cov039-checkbox-calibration-hid

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: macos-14
    timeout-minutes: 50
    env:
      COV_STAGE: checkbox-calibration-hid
      ARC_NAME: ${{ secrets.ARC_A_NAME }}
      ARC_EMAIL: ${{ secrets.ARC_A_EMAIL }}
      ARC_PASSWORD: ${{ secrets.ARC_A_PASSWORD }}
      MAIL_ID: ${{ secrets.MAIL_A_ID }}
      MAIL_TOKEN: ${{ secrets.MAIL_A_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Reversibly calibrate checkbox with guarded HID events
        shell: bash
        run: bash ./collect-preflight.sh
      - name: Upload sanitized HID calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov039-checkbox-calibration-hid
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1
