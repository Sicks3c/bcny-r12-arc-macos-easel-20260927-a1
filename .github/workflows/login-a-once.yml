name: cov065-favorite-command-unicode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Type Favorite command without invoking a candidate
        shell: bash
        env:
          COV_STAGE: favorite-command-calibration
          ARC_EMAIL: ${{ secrets.ARC_A_EMAIL }}
          ARC_PASSWORD: ${{ secrets.ARC_A_PASSWORD }}
        run: bash ./collect-preflight.sh
      - name: Upload sanitized Favorite Unicode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov065-favorite-command-unicode
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1
