name: cov039-login-a-once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Sign in once and map the value-free post-login state
        shell: bash
        env:
          COV_STAGE: login-a-once
          ARC_EMAIL: ${{ secrets.ARC_A_EMAIL }}
          ARC_PASSWORD: ${{ secrets.ARC_A_PASSWORD }}
        run: bash ./collect-preflight.sh
      - name: Upload sanitized one-time sign-in evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov039-login-a-once
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1
