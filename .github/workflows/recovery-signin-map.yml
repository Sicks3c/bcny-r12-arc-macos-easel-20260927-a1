name: cov039-recovery-signin-map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      COV_STAGE: recovery-signin-map
    steps:
      - uses: actions/checkout@v4
      - name: Map value-free recovery sign-in form
        shell: bash
        run: bash ./collect-preflight.sh
      - name: Upload no-secret sign-in map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov039-recovery-signin-map
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1
