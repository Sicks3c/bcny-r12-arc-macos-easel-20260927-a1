name: cov039-login-form-map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      COV_STAGE: login-form-map
    steps:
      - uses: actions/checkout@v4
      - name: Map exact recovery login form
        shell: bash
        run: bash ./collect-preflight.sh
      - name: Upload no-secret login form map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov039-login-form-map
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1
