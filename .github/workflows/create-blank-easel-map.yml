name: cov039-create-blank-easel-map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create_and_map:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create exactly one blank Easel and map deletion candidates
        shell: bash
        env:
          COV_STAGE: create-blank-easel-map
          ARC_EMAIL: ${{ secrets.ARC_A_EMAIL }}
          ARC_PASSWORD: ${{ secrets.ARC_A_PASSWORD }}
        run: bash ./collect-preflight.sh
      - name: Upload sanitized blank-Easel map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov039-create-blank-easel-map
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 1
